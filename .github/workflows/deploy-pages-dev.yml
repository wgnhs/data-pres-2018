name: Deploy to GitHub Pages Dev

on:
  push:
    branches:
      - dev

permissions:
  contents: write      # Required to push commits or tags
  pull-requests: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout data-pres-2018 repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          ref: dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
      
      - name: Checkout data-viewer-dev repo
        uses: actions/checkout@v4
        with:
          repository: wgnhs/data-viewer-dev
          token: ${{ secrets.GH_TOKEN }}
          ref: gh-pages
          path: ./data-viewer-dev

      - name: Copy dist dir to data-viewer-dev
        run: |
          yes | rm -rf ./data-viewer-dev/*
          yes | cp -rf ./data-pres-2018/dist/* ./data-viewer-dev
      
      - name: Commit files to data-viewer-dev
        run: |
          cd ./data-viewer-dev
          git config --local user.email "ejkrznarich@gmail.com"
          git config --local user.name "lizkrznarich"
          git add *
          git commit -m "add new dev release"
          git push origin gh-pages